name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: bizzomephisto/PETEY-DESKTOP
          ref: v0.18.2
          path: petey-desktop
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install flask requests python-dotenv
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: ${{ github.workspace }}/petey-desktop
